<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>十二人</title>
<style>
:root{color-scheme:light dark;--bg:#f3f1ec;--fg:#1f2328;--dim:#6b7076;--card:#fff;--line:#dcd8cf;--accent:#1f5f8b;
  --up:#2f8f5b;--down:#b9473b;--face:#f4d9a6;--ink:#3a2e22;--acq:#2f8f5b;--gui:#9aa0a6;--swing:#d49a0b;--swingbg:#fdf6e3;--tipbg:#fff6dc}
@media (prefers-color-scheme: dark){:root{--bg:#141619;--fg:#e7e7e7;--dim:#8d939a;--card:#1d2024;--line:#30353b;--accent:#6cb6e6;
  --up:#55c486;--down:#e2766a;--face:#d8b57e;--ink:#2a2017;--acq:#55c486;--gui:#5b6168;--swing:#e0b13a;--swingbg:#2a2516;--tipbg:#2b2617}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}
#wrap{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0;color:var(--accent)}
.stat{font-size:15px;color:var(--dim)} .stat b{color:var(--fg);font-size:20px}
#timer.low b{color:var(--down)}
.beta{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--swing);color:#fff;align-self:center}
#ms{margin-left:auto;font-size:12px;color:#888} #ms.err{color:#c0392b}
#grid{display:flex;flex-wrap:wrap;margin:-4px}
#grid .j{width:calc(16.666% - 8px);margin:4px}
@media (max-width:760px){#grid .j{width:calc(25% - 8px)}}
@media (max-width:480px){#grid .j{width:calc(33.333% - 8px)}}
.j{position:relative;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;transition:border-color .3s,background-color .3s,box-shadow .3s}
/* 边框只表示立场：灰=倾向有罪，黄=摇摆（有罪，但再推一把就翻），绿=倾向无罪（计票） */
.j.acq{border-color:var(--acq)}
.j.swing{border-color:var(--swing);background:var(--swingbg)}
.j.hl{box-shadow:0 0 0 3px var(--accent)}
/* 说出口后的反应：卡片上冒一个气泡，几秒后消失 */
.bub{position:absolute;left:3px;right:3px;bottom:3px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:12px;line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .25s;pointer-events:none}
.bub.on{opacity:1}
.bub b{font-weight:normal} .bub.up b{color:var(--up)} .bub.down b{color:var(--down)}
.bub .short{display:none}
.j svg{width:56px;height:56px;display:block;margin:0 auto}
.j .n{font-weight:bold;font-size:14px} .j .r{font-size:12px;color:var(--dim);line-height:1.3;min-height:2.6em}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--gui)} .bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim)}
.j.acq .bar i{background:var(--acq)} .j.swing .bar i{background:var(--swing)}
#banner{display:none;margin-top:8px;padding:8px 12px;border-left:4px solid var(--swing);background:var(--tipbg);border-radius:6px;font-size:14px;line-height:1.5}
#banner div{margin:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 10px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:26px}
.sw{display:inline-block;width:22px;height:16px;border:2px solid var(--line);border-radius:4px;background:var(--card)}
.sw.acq{border-color:var(--acq)} .sw.swing{border-color:var(--swing);background:var(--swingbg)}
#box h3{margin:14px 0 4px;font-size:15px}
.cases{display:flex;flex-direction:column;gap:8px;margin-top:8px}
button.case{display:block;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:10px 12px;line-height:1.5}
button.case:hover{border-color:var(--accent)}
button.case .st{color:var(--swing);margin-right:8px;letter-spacing:1px} button.case b{font-size:16px}
button.case .bl{display:block;font-size:14px;color:var(--fg)} button.case .meta{display:block;font-size:12px;color:var(--dim)}
button.case .won{color:var(--acq)}
#facts.q li{cursor:pointer;border-radius:4px} #facts.q li:hover{background:var(--swingbg)} #facts li .qn{color:var(--accent);font-size:12px;margin-left:6px}
#facts li.new{background:var(--swingbg);border-left:3px solid var(--swing);padding-left:6px}
.evd li{margin:4px 0;font-weight:bold}
/* 陪审团入场：开庭前看一遍 12 个人（时钟还没开始走） */
#roll{display:flex;flex-wrap:wrap;margin:6px -4px 8px}
#roll .rc{width:calc(33.333% - 8px);margin:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
#roll .rc.on{opacity:1;transform:none}
#roll .rc svg{width:40px;height:40px;display:block;margin:0 auto}
#roll .rc .tx{min-width:0}
#roll .rc b{display:block;font-size:14px} #roll .rc .ro{display:block;font-size:12px;color:var(--accent)} #roll .rc .ps{display:block;font-size:12px;color:var(--dim);line-height:1.3;margin-top:2px}
@media (min-width:641px){#roll .rc{width:calc(25% - 8px)}}
@media (max-width:640px){#roll .rc{width:calc(50% - 8px);display:flex;align-items:center;text-align:left;padding:4px 6px;box-sizing:border-box}
  #roll .rc svg{width:34px;height:34px;margin:0 6px 0 0;flex:none} #roll .rc b{display:inline;font-size:13px} #roll .rc .ro{display:inline;margin-left:4px;font-size:11px}
  #roll .rc .ps{font-size:11px;line-height:1.25;margin-top:1px}
  #overlay h2.rollh{font-size:19px;margin:0} #overlay .rollnote{display:none} #roll{margin:4px -4px 6px}}
/* 开庭前选陈词方式：选了才算，按「开始陈词」才开庭 */
.modes{display:flex;gap:8px;margin:10px 0 4px}
.mo{flex:1;display:block;border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;background:var(--card);line-height:1.35}
.mo.on{border-color:var(--accent);background:var(--tipbg)}
.mo input{margin:0 6px 0 0;vertical-align:middle} .mo b{font-size:15px} .mo span{display:block;font-size:12px;color:var(--dim);margin-left:20px}
#modenote{margin:2px 0 8px;min-height:1.4em}
/* 案卷简版：每条一个类型标签（检方红 / 辩方蓝）+ 一句话 */
.tg{display:inline-block;min-width:2.6em;text-align:center;font-size:12px;font-style:normal;border-radius:4px;padding:0 5px;margin-right:6px;color:#fff;background:var(--accent)}
.tg.j{background:var(--down)}
#facts.v{list-style:none;padding-left:0} #facts.v li{padding:3px 0}
#docfull{margin-left:6px}
/* 阅读案卷：开庭前的一页，不计时；点一条展开原文 */
#readl{list-style:none;padding:0;margin:8px 0}
#readl li{padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.5}
#readl li:last-child{border-bottom:0}
#readl .fu{display:none;margin:4px 0 0 0;padding:4px 8px;border-left:3px solid var(--line);font-size:13px;color:var(--dim)}
#readl li.open .fu{display:block} #readl .ar{float:right;color:var(--dim);font-size:12px}
/* 开场镜头：仿像素游戏开场，黑底白框，打字机字幕 */
#intro{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:pointer;-webkit-user-select:none;user-select:none}
#intro canvas{width:640px;max-width:100%;height:auto;border:3px solid #fff;image-rendering:pixelated;image-rendering:crisp-edges;display:block;opacity:0;transition:opacity .25s}
#intro .cap{width:640px;max-width:100%;margin-top:18px;min-height:3.4em;font:20px/1.7 "Courier New","Microsoft YaHei",monospace;letter-spacing:1px}
#intro .tip{color:#666;font-size:12px;margin-top:6px}
#skipintro{position:absolute;top:12px;right:14px;background:transparent;border:1px solid #555;color:#aaa;padding:5px 12px;font-size:13px}
/* 开庭 / 闭庭的大字章 */
#stamp{position:fixed;left:0;top:0;right:0;bottom:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,8,6,.55);pointer-events:none}
#stamp b{font:bold 64px/1.2 "STKaiti","KaiTi","Songti SC","SimSun",serif;letter-spacing:18px;color:#f3e2b8;border:4px solid #b9473b;padding:6px 12px 6px 30px;border-radius:6px;background:rgba(80,20,14,.55);transform:scale(1.6) rotate(-4deg);opacity:0;transition:transform .22s ease-out,opacity .22s}
#stamp.on b{transform:scale(1) rotate(-4deg);opacity:1}
#stamp span{margin-top:18px;color:#fff6dc;font-size:16px;font-weight:bold;opacity:0;transition:opacity .4s .25s;background:rgba(20,14,10,.75);padding:4px 12px;border-radius:4px}
#stamp.on span{opacity:1}
@media (max-width:640px){ #stamp b{font-size:44px;letter-spacing:10px} }
#mute{display:none;padding:2px 9px;font-size:14px;align-self:center}
@media (max-width:640px){ #intro .cap{font-size:16px} }
#main{display:flex;margin-top:12px}
#main>.panel:first-child{flex:2;margin-right:12px} #main>.panel:last-child{flex:1}
@media (max-width:760px){#main{display:block} #main>.panel:first-child{margin:0 0 12px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
#log{height:260px;overflow-y:auto}
.l{margin:4px 0;white-space:pre-wrap;word-break:break-word}
.you{color:var(--accent);font-weight:bold} .you:before{content:"你："}
.react{color:var(--fg);font-size:14px} .react.up:before{content:"▲ ";color:var(--up)} .react.down:before{content:"▼ ";color:var(--down)}
.note{color:var(--dim);font-size:14px}
#dossier ol{padding-left:20px;margin:6px 0} #dossier li{margin:4px 0;font-size:14px}
#say{display:flex;gap:8px;margin-top:10px}
#tools{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
#tools #count{margin-right:auto}
button.sm{padding:5px 10px;font-size:13px}
#docbtn,#docclose{display:none}
#shade{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:15}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(20,22,25,.92);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;max-width:90%;display:none;z-index:30}
/* ---- 手机：计时、12 张脸、输入框固定在顶部，键盘弹出时也看得见 ---- */
@media (max-width:640px){
  #wrap{padding:0 8px 16px}
  #top{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 6px;border-bottom:1px solid var(--line)}
  header{gap:10px;margin-bottom:6px;align-items:center}
  h1{display:none}
  .stat{font-size:13px} .stat b{font-size:16px}
  #grid{margin:-2px}
  #grid .j{width:calc(25% - 4px);margin:2px;padding:3px 2px 4px;border-radius:8px}
  .j svg{width:32px;height:32px}
  .j .n{font-size:12px;line-height:1.3}
  .j .r{min-height:0;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .j .pers{display:none}
  .bar{height:4px;margin-top:3px}
  .bub{font-size:11px;padding:2px;text-align:center} .bub .full{display:none} .bub .short{display:inline}
  #banner{margin-top:6px;padding:6px 10px;font-size:13px}
  #say{margin-top:6px}
  #in{padding:9px 10px}
  #say button{padding:9px 14px}
  #tools{margin-top:5px}
  #docbtn{display:inline-block}
  #chips{margin-top:8px}
  #main{display:block;margin-top:8px}
  #log{height:auto;overflow:visible;display:flex;flex-direction:column-reverse}   /* 最新的在最上面，紧挨输入框 */
  #dossier{display:none}
  #dossier.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow-y:auto;z-index:20;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
  #docclose{display:inline-block;float:right}
  #overlay{padding:10px !important;align-items:flex-start !important;overflow-y:auto;-webkit-overflow-scrolling:touch} #overlay .box{padding:16px;max-height:none !important;overflow:visible !important;margin:0 0 10px}
  #box ol{padding-left:18px} #box li{margin:4px 0}
}
#in{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
#count{font-size:12px;color:var(--dim);text-align:right}
#chips{margin-top:8px} #chips button{padding:4px 10px;font-size:13px;margin:0 6px 6px 0}
#hint{margin-left:8px}
.tip{color:#8a5a00;font-size:14px} .tip:before{content:"※ "}
#box ol{padding-left:20px} #box li{margin:6px 0}
#overlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
#overlay .box{background:var(--card);color:var(--fg);max-width:620px;width:100%;max-height:90vh;overflow-y:auto;border-radius:12px;padding:20px 22px}
#overlay h2{margin:0 0 8px;color:var(--accent)}
.vr{display:flex;gap:8px;margin:6px 0;font-size:14px} .vr b{min-width:4.5em} .vr>span:first-of-type{min-width:2.5em} .vr .a{color:var(--acq)} .vr .g{color:var(--dim)} .vr .s{color:var(--swing)}
.best{margin:10px 0 12px;padding:10px 12px;border-left:4px solid var(--acq);background:var(--swingbg);border-radius:6px} .best .q{font-size:16px;font-weight:bold;margin:2px 0}
</style>
</head>
<body>
<div id="err" style="display:none;background:#c0392b;color:#fff;padding:8px 16px;font-size:14px"></div>
<div id="wrap">
  <div id="top">
    <header>
      <h1 id="title">十二人</h1>
      <span class="stat" id="timer">剩余 <b id="t">--:--</b></span>
      <span class="stat">无罪 <b id="votes">0</b>/12 · 需 <span id="need">7</span></span>
      <span class="stat" id="saysbox" style="display:none">剩 <b id="saysleft">5</b> 句</span>
      <button id="mute" class="ghost sm" title="配乐开关">♪</button>
      <span id="ms"></span>
    </header>
    <div id="grid"></div>
    <div id="banner"></div>
    <div id="say">
      <input id="in" autocomplete="off" enterkeyhint="send" placeholder="先点「开始陈词」">
      <button id="go" disabled>说出口</button>
    </div>
    <div id="tools">
      <span id="count"></span>
      <button id="docbtn" class="ghost sm">案卷</button>
      <button id="hint" class="ghost sm" disabled>提示 −10秒</button>
      <button id="rest" class="ghost sm" disabled>结束陈词</button>
    </div>
  </div>
  <div id="chips"></div>
  <div id="main">
    <div class="panel"><div id="log"></div></div>
    <div class="panel" id="dossier">
      <b>案卷</b><button id="docfull" class="ghost sm" style="display:none">展开原文</button><button id="docclose" class="ghost sm">收起</button>
      <div class="note" id="quotehint" style="display:none;margin-top:4px">点一条可以<b>引用</b>到输入框（打字慢也不吃亏），但引完要写出你自己的推理。</div>
      <ol id="facts"></ol>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="stamp"><b id="stampword"></b><span id="stampsub"></span></div>
<div id="intro"><button id="skipintro">跳过 ›</button><canvas id="introcv" width="160" height="90"></canvas><div class="cap" id="introcap"></div><div class="tip">点击 / 空格 / 回车 继续</div></div>
<div id="shade"></div>
<div id="overlay"><div class="box" id="box"></div></div>
<script>
// 页面出错时显示出来，并报给服务端（打印在开服务的那个窗口里），方便排查不同浏览器的问题
window.onerror=function(msg, src, line, col){
  try{
    var e=document.getElementById('err'); e.style.display='block';
    e.textContent='页面出错：'+msg+'（第 '+line+' 行）。请把这行字和浏览器版本告诉开服务的人，然后按 Ctrl+F5 刷新。';
    var x=new XMLHttpRequest(); x.open('POST','/api/client_error',true); x.setRequestHeader('Content-Type','application/json');
    x.send(JSON.stringify({msg:String(msg), line:line, col:col, ua:navigator.userAgent}));
  }catch(_){}
};
</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var C=null, jurors=[], leans={}, started=false, over=false, deadline=0, timerId=0;
  var composing=false, inflight=false, pending=false, lastSent=null, debounce=300, dTimer=0, seq=0; var lastTotal=0;   // 上一次预览的总耗时，随下一次预览报给服务端记日志

  function post(path, body, cb){
    var x=new XMLHttpRequest(); x.open('POST', path, true); x.setRequestHeader('Content-Type','application/json');
    x.onreadystatechange=function(){ if(x.readyState!==4) return; var r=null; try{r=JSON.parse(x.responseText);}catch(e){} cb(x.status, r||{}); };
    x.send(JSON.stringify(body||{}));
  }
  function log(cls, text){ var d=document.createElement('div'); d.className='l '+cls; d.textContent=text; $('log').appendChild(d); $('log').scrollTop=$('log').scrollHeight; }

  // ---- 脸 ----
  function face(m){
    var mouth = m>0 ? 'M17 39 Q28 49 39 39' : (m<0 ? 'M17 44 Q28 35 39 44' : 'M18 41 L38 41');
    var brows = m<0 ? '<path d="M15 19 L24 22 M41 19 L32 22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' : '';
    var col = m>0 ? '#1e7a46' : (m<0 ? '#b0281a' : '#1f160e');
    return '<svg viewBox="0 0 56 56" data-m="'+m+'" style="color:'+col+'"><circle cx="28" cy="28" r="25" fill="'+(m>0?'#cfe8c6':m<0?'#f3c9bd':'#f4d9a6')+'" stroke="currentColor" stroke-opacity=".55" stroke-width="2"/>'+
      '<circle cx="20" cy="26" r="3.6" fill="currentColor"/><circle cx="36" cy="26" r="3.6" fill="currentColor"/>'+brows+
      '<path d="'+mouth+'" stroke="currentColor" stroke-width="3.6" fill="none" stroke-linecap="round"/></svg>';
  }
  function setFaces(f){ for(var i=0;i<jurors.length;i++){ var id=jurors[i].id; $('f_'+id).innerHTML=face(f&&f[id]||0); } }
  // 边框只表示立场：倾向 > 0 无罪（计票）；-swing < 倾向 <= 0 摇摆（仍算有罪）；其余有罪
  function stance(v){ return v>0 ? 'acq' : (v>-swing ? 'swing' : ''); }
  function setLeans(L){
    leans=L; var n=0;
    for(var i=0;i<jurors.length;i++){
      var id=jurors[i].id, v=L[id], card=$('j_'+id), bar=$('b_'+id);
      if(v>0) n++;
      card.className='j '+stance(v)+(hl===id?' hl':'');
      var w=Math.min(50, Math.abs(v)/5*50);
      bar.style.left = v>=0 ? '50%' : (50-w)+'%'; bar.style.width = w+'%';
    }
    $('votes').textContent=n;
  }
  // 说出口后：有反应的人卡片上冒气泡（电脑上是整句反应，手机上是"被打动 / 反感"），几秒后消失
  var bubT=0;
  function bubbles(reactions){
    clearTimeout(bubT);
    for(var i=0;i<jurors.length;i++) $('u_'+jurors[i].id).className='bub';
    for(var k=0;k<reactions.length;k++){ var r=reactions[k], b=$('u_'+r.juror);
      b.className='bub on '+(r.dir>0?'up':'down');
      b.innerHTML='<b>'+(r.dir>0?'▲':'▼')+'</b> <span class="full"></span><span class="short">'+(r.dir>0?'被打动':'反感')+'</span>';
      b.getElementsByTagName('span')[0].textContent=r.text; }
    bubT=setTimeout(function(){ for(var i=0;i<jurors.length;i++) $('u_'+jurors[i].id).className='bub'; }, 4000);
  }
  var hl=null, hlT=0;

      if(ev.dossier&&ev.dossier.length){ var lis=uls[u++].getElementsByTagName('li'); for(var q=0;q<ev.dossier.length;q++) lis[q].textContent=ev.dossier_view&&ev.dossier_view[q]?ev.dossier_view[q].text:ev.dossier[q]; } }
    $('overlay').style.display='flex'; $('evok').onclick=function(){ $('overlay').style.display='none'; $('in').focus(); };
    if(r.dossier){ C.dossier=r.dossier; C.dossier_view=r.dossier_view; renderDossier(r.dossier, added); }
    if(r.leans) setLeans(r.leans);
    if(r.time_left!=null){ deadline=new Date().getTime()+r.time_left*1000; tick(); }
    var lines=[]; for(var w=0;w<r.events.length;w++) lines.push('【'+r.events[w].title+'】'+r.events[w].text);
    banner((keep||[]).concat(lines)); for(var z=0;z<lines.length;z++) log('tip', lines[z]);
  }
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  var saysLeft=0, ending=false;
  function begin(mode){
    curMode=mode||'';
    post('/api/begin', {mode: mode||''}, function(s, r){
      if(s!==200 || !r.time_left){
        $('box').innerHTML='<h2>开庭失败</h2><p></p><p><button id="again">重新开庭</button></p>';
        $('box').getElementsByTagName('p')[0].textContent=(r.error||('服务器返回 '+s))+'（服务可能刚重启过）';
        $('again').onclick=function(){ location.reload(); }; return;
      }
      $('overlay').style.display='none'; started=true; music('trial');
      gavel(2); stamp('开 庭', '审判长：请辩护人开始终局陈词。', 1500);
      if(r.max_says){ saysLeft=r.max_says; $('saysleft').textContent=saysLeft; $('saysbox').style.display='inline'; }
      deadline=new Date().getTime()+r.time_left*1000; tick(); timerId=setInterval(tick, 250); setInterval(poll, 50);
      $('in').disabled=false; $('go').disabled=false; $('rest').disabled=false; $('hint').disabled=false;
      log('tip', '开庭了。在下面输入一句辩护的话，停一下，看看谁点头、谁皱眉；满意了再按回车。');
      banner(['开庭了。先试试下面两句：一句讲证据，一句讲人情——看看点头的是不是同一批人。', '表情 = 对你正在打的话的预览；绿框 = 倾向无罪，黄框 = 摇摆，灰框 = 有罪。']);
      var ex=C.examples||[], h='';
      for(var i=0;i<ex.length;i++) h+='<button class="ghost ex">试一句：'+esc(ex[i])+'</button>';
      $('chips').innerHTML=h; var bs=$('chips').getElementsByTagName('button');
      for(var k=0;k<bs.length;k++) bs[k].onclick=(function(t){ return function(){ $('in').value=t; $('in').focus(); }; })(ex[k]); $('in').placeholder='说一句辩护的话，停一下看脸……'; $('in').focus();
    });
  }

  // ---- 输入法：拼音还没选字时不发 ----
  var inp=$('in');
  inp.addEventListener('focus', function(){ if(!started && !over && C && $('start')){ $('overlay').style.display='flex'; } });
  inp.setAttribute('maxlength', 100);
  inp.addEventListener('compositionstart', function(){ composing=true; lastComp=new Date().getTime(); });
  inp.addEventListener('compositionupdate', function(){ lastComp=new Date().getTime(); });
  inp.addEventListener('compositionend', function(){ composing=false; });
  inp.addEventListener('keydown', function(e){
    if(e.keyCode===13 && !e.isComposing){ e.preventDefault(); say(); }   // 输入法选字时的回车 keyCode 是 229，不会进这里
  });
  function doc(open){ $('dossier').className=open?'panel open':'panel'; $('shade').style.display=open?'block':'none'; }
  $('docbtn').onclick=function(){ doc(true); };
  $('docclose').onclick=function(){ doc(false); };
  $('docfull').onclick=function(){ showFullDoc=!showFullDoc; renderDossier(C.dossier, lastNew); };
  $('shade').onclick=function(){ doc(false); };
  var toastT=0;
  function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toastT); toastT=setTimeout(function(){ e.style.display='none'; }, 2500); }
  $('grid').onclick=function(e){   // 手机上不显示人设，点头像看一眼
    var el=e.target; while(el && el!==this && (' '+el.className+' ').indexOf(' j ')<0) el=el.parentNode;
    if(!el || el===this) return;
    for(var i=0;i<jurors.length;i++) if('j_'+jurors[i].id===el.id){ toast(jurors[i].name+'：'+jurors[i].role+'，'+jurors[i].persona); return; }
  };
  $('go').onclick=say; $('hint').onclick=hint; $('rest').onclick=function(){ if(confirm('确定结束陈词吗？')) rest(); };

  // 访问口令：可以直接放在链接里分享（?code=xxx），否则弹框输入
  var code=(location.search.match(/[?&]code=([^&]+)/)||[])[1]; code=code?decodeURIComponent(code):'';
  var caseId=(location.search.match(/[?&]case=([^&]+)/)||[])[1]; caseId=caseId?decodeURIComponent(caseId):'';
  var nCases=1;
  function askCode(msg){
    $('box').innerHTML='<h2>十二人</h2><p id="cmsg"></p><p><input id="code" style="font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:6px"> <button id="cgo">进入</button></p>';
    $('cmsg').textContent=msg; $('overlay').style.display='flex';
    var go=function(){ code=$('code').value.replace(/^\s+|\s+$/g,''); open(); };
    $('cgo').onclick=go; $('code').onkeydown=function(e){ if(e.keyCode===13) go(); }; $('code').focus();
  }
  function open(){ post('/api/new', {code:code, 'case':caseId}, function(s, r){
    if(s===401){ return askCode(r.error||'请输入访问口令。'); }
    if(s===200 && r.cases && !r.case){ nCases=r.cases.length; return showSelect(r.cases, r.channel); }   // 先选关
    if(r.cases) nCases=r.cases;
    if(s!==200){ $('box').innerHTML='<h2>无法开庭</h2><p></p>'; $('box').getElementsByTagName('p')[0].textContent=r.error||('错误 '+s); $('overlay').style.display='flex'; return; }
    C=r.case; jurors=C.jurors; debounce=(C.debounce==null?120:C.debounce); swing=C.swing_band||0;
    $('title').textContent=C.title; $('need').textContent=C.win_votes; inp.setAttribute('maxlength', C.max_chars);
    var g='';
    for(var i=0;i<jurors.length;i++){ var j=jurors[i];
      g+='<div class="j" id="j_'+j.id+'"><div id="f_'+j.id+'"></div><div class="n">'+esc(j.name)+'</div><div class="r"><span class="role">'+esc(j.role)+'</span><span class="pers"><br>'+esc(j.persona)+'</span></div><div class="bar"><span class="mid"></span><i id="b_'+j.id+'"></i></div><div class="bub" id="u_'+j.id+'"></div></div>'; }
    $('grid').innerHTML=g; setFaces({}); setLeans(r.leans);
    renderDossier(C.dossier, 0);
    var m=Math.floor(C.time_limit/60);
    $('t').textContent=m+':'+('0'+C.time_limit%60).slice(-2);
    var cost=C.hint_cost||10;
    M=r.music||{}; for(var mk in M){ $('mute').style.display='inline-block'; break; }
    if(M.gavel && !gavelBuf) loadGavel(M.gavel);
    if(muted){ $('mute').textContent='♪×'; $('mute').style.opacity=0.5; }
    var hasIntro=C.intro && C.intro.length;
    var rollKey='twelve_roll_'+C.id;
    function seenRoll(){ try{ return localStorage.getItem(rollKey)==='1'; }catch(e){ return false; } }
    var showRoll=function(done){
      var h='<h2 class="rollh">陪审团入场</h2><p class="note rollnote" style="margin:0">十二个人，各有各的脾气。先认认人，时钟还没开始走。</p><div id="roll">';
      for(var i=0;i<jurors.length;i++){ var j=jurors[i];
        h+='<div class="rc">'+face(0)+'<div class="tx"><b>'+esc(j.name)+'</b><span class="ro">'+esc(j.role)+'</span><span class="ps">'+esc(j.persona)+'</span></div></div>'; }
      $('box').innerHTML=h+'</div><p style="margin:0"><button id="seat">入座，看说明</button></p>';
      $('overlay').style.display='flex';
      var cards=$('roll').getElementsByTagName('div'), k=0, cs=[];
      for(var c=0;c<cards.length;c++) if(cards[c].className==='rc') cs.push(cards[c]);
      var t=setInterval(function(){ if(k>=cs.length){ clearInterval(t); return; } cs[k++].className='rc on'; }, 140);
      $('seat').onclick=function(){ clearInterval(t); try{ localStorage.setItem(rollKey,'1'); }catch(e){} done(); };
    };
    var readKey='twelve_read_'+C.id;
    function seenRead(){ try{ return localStorage.getItem(readKey)==='1'; }catch(e){ return false; } }
    var showRead=function(done){
      var v=C.dossier_view, ok=v&&v.length===C.dossier.length, h='<h2>阅读案卷</h2><p class="note" style="margin:0" id="readbrief"></p>'+
        '<p class="note" style="margin:4px 0 0">时钟还没开始走，慢慢读。点一条可以展开原文。</p><ol id="readl"></ol>';
      $('box').innerHTML=h+'<p style="margin:0"><button id="readok">读完了</button> <button id="readall" class="ghost sm">全部展开</button></p>';
      $('readbrief').textContent=C.brief; $('overlay').style.display='flex';
      var ul=$('readl'), allOpen=false;
      for(var i=0;i<C.dossier.length;i++){
        var li=document.createElement('li'), tg=document.createElement('i'), sh=document.createElement('span'), ar=document.createElement('span'), fu=document.createElement('div');
        tg.className='tg'+(ok&&v[i].side==='检'?' j':''); tg.textContent=ok?v[i].side+'·'+v[i].tag:(C.dossier[i].indexOf('检方')===0?'检':'辩');
        sh.textContent=ok?v[i].text:C.dossier[i]; ar.className='ar'; fu.className='fu'; fu.textContent=C.dossier[i];
        li.appendChild(tg); li.appendChild(sh); if(ok){ ar.textContent='▾'; li.appendChild(ar); li.appendChild(fu); }
        li.onclick=function(){ this.className=this.className==='open'?'':'open'; };
        ul.appendChild(li); }
      $('readall').onclick=function(){ allOpen=!allOpen; var lis=ul.getElementsByTagName('li'); for(var k=0;k<lis.length;k++) lis[k].className=allOpen?'open':''; this.textContent=allOpen?'全部收起':'全部展开'; };
      if(!ok) $('readall').style.display='none';
      $('readok').onclick=function(){ try{ localStorage.setItem(readKey,'1'); }catch(e){} done(); };
    };
    var showBrief=function(){
    var phone=window.innerWidth<=640;
    // 手机上一屏就要看得到「开始陈词」：先给三步和按钮，图例和窍门收进「详细说明」（电脑上默认展开）
    $('box').innerHTML='<h2>'+esc(C.title)+'</h2><p id="brief"></p>'+
      '<ol>'+
      '<li>打一句辩护的话，<b>停一下</b>，看 12 张脸谁点头、谁皱眉。</li>'+
      '<li>满意了按<b>回车</b>，这句话才算说出口。</li>'+
      '<li>'+Math.round(C.time_limit/60)+' 分钟内让至少 <b>'+C.win_votes+'</b> 人倾向无罪（<span style="color:var(--acq)">绿框</span>）。'+(phone?'事实在「案卷」里。':'事实在右边的案卷里。')+'</li></ol>'+
      (C.modes&&C.modes.easy?'<div class="modes" id="modes">'+'<label class="mo"><input type="radio" name="mode" value=""><b>标准陈词</b><span>'+Math.round(C.time_limit/60)+' 分钟 · 句数不限</span></label>'+'<label class="mo"><input type="radio" name="mode" value="easy"><b>'+esc(C.modes.easy.label)+'</b><span>'+Math.round(C.modes.easy.time_limit/60)+' 分钟 · 限 '+C.modes.easy.max_says+' 句</span></label></div>'+'<p class="note" id="modenote"></p>':'')+
      '<p><button id="start">开始陈词</button> <button id="more" class="ghost sm">'+(phone?'详细说明 ▾':'收起说明 ▴')+'</button>'+(hasIntro?' <button id="replay" class="ghost sm">重看开场</button>':'')+' <button id="roster" class="ghost sm">看陪审团</button> <button id="reread" class="ghost sm">读案卷</button></p>'+
      '<div id="detail" style="display:'+(phone?'none':'block')+'">'+
      '<h3>看懂陪审员</h3>'+
      '<div class="legend"><span>'+face(1)+'点头</span><span>'+face(0)+'没感觉</span><span>'+face(-1)+'皱眉</span></div>'+
      '<p class="note" style="margin:0 0 8px">表情只是对<b>你正在打的这句话</b>的预览，输入框空着时都是平静的。</p>'+
      '<div class="legend"><span><i class="sw acq"></i>绿框：倾向无罪（计票）</span><span><i class="sw swing"></i>黄框：摇摆中，还算有罪，再推一把就翻</span><span><i class="sw"></i>灰框：倾向有罪</span></div>'+
      '<p class="note" style="margin:0 0 8px">脸下面的细条是倾向：越往右越倾向无罪。说出口后，被打动或反感的人卡片上会冒出反应（▲ / ▼），输入框上方的黄条告诉你还差几票。</p>'+
      '<h3>窍门</h3><ul>'+
      '<li>每个人在意的东西不一样：同一句话，有人点头，有人皱眉。看看他们的身份。</li>'+
      '<li>照抄案卷、反复讲同一件事、话说一半都不管用——要说出事实<b>意味着什么</b>。</li>'+
      (C.quote?'<li>打字慢？点右边（手机上点「案卷」）里的条目就能<b>引用</b>，但引完要写上你自己的话。</li>':'')+
      '<li>卡住了点<b>提示</b>（扣 '+cost+' 秒）；连续两句没有进展，会免费送你一次。</li>'+
      '<li>别想着下命令——陪审员不吃这一套。时间一开始就不会停。</li></ul></div>';
    $('more').onclick=function(){ var d=$('detail'), open=d.style.display==='none';
      d.style.display=open?'block':'none'; this.textContent=open?'收起说明 ▴':'详细说明 ▾'; };
    $('brief').textContent=C.brief; $('overlay').style.display='flex'; var chosen=C.modes&&C.modes.easy?modePref(C.id):'';
    if($('modes')){
      var radios=$('modes').getElementsByTagName('input'), note=$('modenote');
      var paint=function(){ for(var r=0;r<radios.length;r++){ radios[r].parentNode.className='mo'+(radios[r].checked?' on':''); if(radios[r].checked) chosen=radios[r].value; }
        note.textContent=chosen==='easy'?C.modes.easy.blurb:'时间一到就宣判，想说多少句都行。'; setModePref(C.id, chosen); };
      for(var r=0;r<radios.length;r++){ radios[r].checked=(radios[r].value===chosen); radios[r].onchange=paint; }
      paint();
    }
    $('start').onclick=function(){ begin(chosen); };
    $('roster').onclick=function(){ showRoll(showBrief); };
    $('reread').onclick=function(){ showRead(showBrief); };
    if(hasIntro) $('replay').onclick=function(){ $('overlay').style.display='none'; playIntro(C.intro, showBrief); };
    };
    var afterRead=function(){ if(seenRoll()) showBrief(); else showRoll(showBrief); };      // 先读案卷，再认陪审团
    var afterIntro=function(){ if(seenRead()) afterRead(); else showRead(afterRead); };
    if(hasIntro && !seenIntro(C.id)){ $('overlay').style.display='none'; playIntro(C.intro, afterIntro); } else afterIntro();
    if(r.backend==='mock') $('ms').textContent='（离线模拟模式）';
    if(r.channel==='beta'){ var bg=document.createElement('span'); bg.className='beta'; bg.textContent='内测版'; $('title').parentNode.insertBefore(bg, $('title').nextSibling); document.title='十二人（内测版）'; }
  }); }
  open();
})();
</script>
</body>
</html>
